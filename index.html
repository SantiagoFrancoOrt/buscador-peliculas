<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Buscador de peliculas hecho con React y Vite, con datos de la API de TMDB."
    />
    <title>Buscador de Peliculas</title>
    <script>
      // Aplica el tema antes de que se pinte la pagina, para que quien use el
      // tema oscuro no vea un flash blanco mientras carga React.
      ;(function () {
        try {
          var guardado = localStorage.getItem('buscador-peliculas:tema')
          var oscuro = guardado
            ? guardado === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = oscuro ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
